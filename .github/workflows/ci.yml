# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  push:
    branches: [master]
  pull_request:
  merge_group:
  workflow_dispatch:

# Least privilege: CI only ever needs to read the repository.
permissions:
  contents: read

# Supersede in-flight runs for the same ref; never cancel master.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Run oxlint
        run: pnpm lint

      - name: Verify formatting
        run: pnpm format:check

  type-check:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Run tsc --noEmit
        run: pnpm type-check

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Vitest 5 requires ^22.12 || ^24 || >=26, and pnpm 11 itself needs
        # Node >=22.13, so the unit suite cannot run on the engines floor.
        # The floor is covered by the `smoke` job instead.
        node-version: ['22', '24']
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up toolchain
        uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run unit tests
        run: pnpm test

  # `engines.node` advertises >=20.19, which no runner in this toolchain can
  # execute on. Prove the claim directly instead: build with the toolchain,
  # then load the built artifacts under the floor version using plain node.
  smoke:
    name: Smoke (Node 20.19, engines floor)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Build
        run: pnpm build

      # pnpm cannot run on Node 20.x, so switch the runtime only once install
      # and build are done, then drive node directly.
      - name: Switch to the engines floor
        uses: actions/setup-node@v7
        with:
          node-version: '20.19'

      - name: Load both builds and compare export surfaces
        run: |
          node --version
          node scripts/check-dual-build.mjs

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Build dual ESM + CJS output
        run: pnpm build

      - name: Assert both module formats emitted
        run: |
          test -f dist/cjs/index.js   || { echo "::error::missing dist/cjs/index.js"; exit 1; }
          test -f dist/esm/index.js   || { echo "::error::missing dist/esm/index.js"; exit 1; }
          test -f dist/cjs/index.d.ts || { echo "::error::missing dist/cjs/index.d.ts"; exit 1; }
          test -f dist/esm/index.d.ts || { echo "::error::missing dist/esm/index.d.ts"; exit 1; }
          grep -q '"type": *"commonjs"' dist/cjs/package.json || { echo "::error::cjs stub wrong"; exit 1; }
          grep -q '"type": *"module"'   dist/esm/package.json || { echo "::error::esm stub wrong"; exit 1; }

      - name: Assert decorator metadata is preserved
        run: |
          grep -q 'design:paramtypes' dist/cjs/module/twilio.service.js \
            || { echo "::error::CJS build lost emitDecoratorMetadata — Nest DI will break"; exit 1; }
          grep -q 'design:paramtypes' dist/esm/module/twilio.service.js \
            || { echo "::error::ESM build lost emitDecoratorMetadata — Nest DI will break"; exit 1; }

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

  package:
    name: Package exports
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Build
        run: pnpm build

      - name: Validate package.json with publint
        run: pnpm exec publint --strict

      - name: Validate type resolution with are-the-types-wrong
        run: pnpm exec attw --pack .

      - name: Verify both builds load and expose the same surface
        run: pnpm check:runtime

  # Single required status check. Branch protection points at this job only,
  # so adding or renaming a matrix leg never requires editing branch rules.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [lint, type-check, test, smoke, build, package]
    if: always()
    steps:
      - name: Verify all upstream jobs succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::One or more CI jobs failed."
            exit 1
          fi
          echo "All CI jobs succeeded."
