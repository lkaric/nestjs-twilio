# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  push:
    branches: [master]
  pull_request:
  merge_group:
  workflow_dispatch:

# Least privilege: CI only ever needs to read the repository.
permissions:
  contents: read

# Supersede in-flight runs for the same ref; never cancel master.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Run oxlint
        run: pnpm lint

      - name: Verify formatting
        run: pnpm format:check

  type-check:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Run tsc --noEmit
        run: pnpm type-check

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Vitest 5 requires ^22.12 || ^24 || >=26, and pnpm 11 itself needs
        # Node >=22.13, so the unit suite cannot run on the engines floor.
        # The floor is covered by the `smoke` job instead.
        node-version: ['22', '24']
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up toolchain
        uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run unit tests
        run: pnpm test

  # `engines.node` advertises >=20.19, which no runner in this toolchain can
  # execute on. Prove the claim directly instead: build with the toolchain,
  # then load the built artifacts under the floor version using plain node.
  smoke:
    name: Smoke (Node 20.19, engines floor)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Build
        run: pnpm build

      # pnpm cannot run on Node 20.x, so switch the runtime only once install
      # and build are done, then drive node directly.
      - name: Switch to the engines floor
        uses: actions/setup-node@v7
        with:
          node-version: '20.19'

      - name: Load both builds and compare export surfaces
        run: |
          node --version
          node scripts/check-dual-build.mjs

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Build dual ESM + CJS output
        run: pnpm build

      - name: Assert both module formats emitted
        run: |
          test -f dist/cjs/index.js   || { echo "::error::missing dist/cjs/index.js"; exit 1; }
          test -f dist/esm/index.js   || { echo "::error::missing dist/esm/index.js"; exit 1; }
          test -f dist/cjs/index.d.ts || { echo "::error::missing dist/cjs/index.d.ts"; exit 1; }
          test -f dist/esm/index.d.ts || { echo "::error::missing dist/esm/index.d.ts"; exit 1; }
          grep -q '"type": *"commonjs"' dist/cjs/package.json || { echo "::error::cjs stub wrong"; exit 1; }
          grep -q '"type": *"module"'   dist/esm/package.json || { echo "::error::esm stub wrong"; exit 1; }

      - name: Assert decorator metadata is preserved
        run: |
          grep -q 'design:paramtypes' dist/cjs/module/twilio.service.js \
            || { echo "::error::CJS build lost emitDecoratorMetadata — Nest DI will break"; exit 1; }
          grep -q 'design:paramtypes' dist/esm/module/twilio.service.js \
            || { echo "::error::ESM build lost emitDecoratorMetadata — Nest DI will break"; exit 1; }

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

  package:
    name: Package exports
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Build
        run: pnpm build

      - name: Validate package.json with publint
        run: pnpm exec publint --strict

      - name: Validate type resolution with are-the-types-wrong
        run: pnpm exec attw --pack .

      - name: Verify both builds load and expose the same surface
        run: pnpm check:runtime

  # The documentation site is part of the repository's build, so a broken site
  # must fail review rather than fail at deploy time. docs.yml only deploys.
  docs:
    name: Docs site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Build documentation site
        run: pnpm docs:build

  # The example consumes the library through a workspace link, so it compiles
  # against the built output rather than the sources. That makes it the only
  # check that exercises the published surface the way a consumer would, and
  # it is what caught the DI defects this package shipped with.
  example:
    name: Example app
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Build the library
        run: pnpm build

      - name: Compile the example against it
        run: pnpm example:build

      - name: Boot the example and assert it serves
        run: |
          node examples/basic/dist/main.js &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT

          for _ in $(seq 1 30); do
            if curl -sf http://localhost:3000/sms/accounts >/dev/null; then break; fi
            sleep 1
          done

          accounts=$(curl -sf http://localhost:3000/sms/accounts) || {
            echo "::error::the example app did not start"; exit 1; }
          echo "resolved clients: $accounts"

          # Two independently credentialed clients must resolve side by side.
          node -e "
            const a = JSON.parse(process.argv[1]);
            if (!a.default || !a.billing || a.default === a.billing) {
              console.error('::error::forRoot and forFeature did not yield distinct clients');
              process.exit(1);
            }
          " "$accounts"

          # An unsigned webhook must be rejected. This failing open is the
          # defect the example uncovered; it must never regress.
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/webhooks/sms \
            -H 'Content-Type: application/x-www-form-urlencoded' --data 'Body=hi')
          if [ "$status" != "403" ]; then
            echo "::error::unsigned webhook returned $status, expected 403"
            exit 1
          fi
          echo "unsigned webhook correctly rejected with 403"

          # The health indicator is built on Terminus' attempt(), so an
          # unreachable or unauthorised Twilio must surface as a 503 "down"
          # result. A 500 would mean the indicator threw and aborted the whole
          # health check, which is the failure mode the Terminus docs warn
          # about. Credentials here are deliberately invalid.
          health=$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 30 \
            http://localhost:3000/health || true)
          if [ "$health" != "503" ]; then
            echo "::error::health check returned $health, expected 503"
            cat /tmp/health.json || true
            exit 1
          fi
          node -e "
            const report = require('/tmp/health.json');
            const details = report.details ?? {};
            for (const key of ['twilio', 'twilio-billing']) {
              if (details[key]?.status !== 'down') {
                console.error('::error::' + key + ' should be down, got ' + details[key]?.status);
                process.exit(1);
              }
            }
          "
          echo "health check correctly reported 503 with both clients down"

          # Access tokens are signed with an API key. The `realtime` client is
          # registered with one beneath an auth-token root, so this also proves
          # the inherited auth token does not outrank the explicit API key —
          # the defect the example app surfaced.
          curl -s -o /tmp/token.json 'http://localhost:3000/token/voice?identity=alice'
          node -e "
            const { token } = require('/tmp/token.json');
            if (!token) {
              console.error('::error::no token minted');
              process.exit(1);
            }
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64').toString());
            if (claims.iss !== process.env.TWILIO_API_KEY) {
              console.error('::error::token issuer is ' + claims.iss + ', expected the API key SID');
              process.exit(1);
            }
            if (claims.grants?.identity !== 'alice') {
              console.error('::error::token identity is ' + claims.grants?.identity);
              process.exit(1);
            }
          "
          echo "voice token correctly signed by the API key client"

          # Voice rejects identities outside [A-Za-z0-9_], and fails at
          # connection time in the browser rather than at mint time.
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            'http://localhost:3000/token/voice?identity=alice@example.com')
          if [ "$status" != "400" ]; then
            echo "::error::invalid voice identity returned $status, expected 400"
            exit 1
          fi
          echo "invalid voice identity correctly rejected with 400"
        env:
          TWILIO_ACCOUNT_SID: ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          TWILIO_API_KEY: SKxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          TWILIO_API_SECRET: ci_test_api_key_secret
          TWILIO_AUTH_TOKEN: ci_test_auth_token
          TWILIO_BILLING_ACCOUNT_SID: ACyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy
          TWILIO_BILLING_AUTH_TOKEN: ci_billing_auth_token
          TWILIO_PHONE_NUMBER: '+15550001111'

  # Single required status check. Branch protection points at this job only,
  # so adding or renaming a matrix leg never requires editing branch rules.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [lint, type-check, test, smoke, build, package, docs, example]
    if: always()
    steps:
      - name: Verify all upstream jobs succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::One or more CI jobs failed."
            exit 1
          fi
          echo "All CI jobs succeeded."
