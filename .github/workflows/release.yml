# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Compute the next release without publishing it.
        type: boolean
        default: false

# Never run two releases at once, and never cancel one midway: an interrupted
# release can tag and commit without ever publishing to npm.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Re-verify from a clean checkout. A release must never rely on a green check
  # recorded against an older commit.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Type check
        run: pnpm type-check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate package.json with publint
        run: pnpm exec publint --strict

      - name: Validate type resolution with are-the-types-wrong
        run: pnpm exec attw --pack .

  release:
    name: Publish
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write # push the changelog/version commit and the git tag
      issues: write # comment on issues referenced by released commits
      pull-requests: write # comment on released pull requests
      id-token: write # mint the OIDC token for npm trusted publishing
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # semantic-release walks the full history to compute the next version.
          fetch-depth: 0
          # semantic-release installs its own credentials; leaving the checkout
          # credentials in place makes it push as the wrong identity.
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Build distribution
        run: pnpm build

      # @semantic-release/npm v13 resolves authentication in this order:
      #   1. npm trusted publishing — exchanges the GitHub OIDC token for a
      #      short-lived registry token. Requires id-token: write above, plus a
      #      trusted publisher configured for this package on npmjs.com that
      #      names this repository and this workflow file. Provenance is then
      #      attested automatically.
      #   2. NPM_TOKEN — used only when no trusted publisher is configured.
      #      NPM_CONFIG_PROVENANCE is what attests provenance on this path.
      # Keeping both means the release works today on the token, and silently
      # upgrades to tokenless the moment the trusted publisher is registered.
      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: pnpm exec semantic-release ${{ inputs.dry-run && '--dry-run' || '' }}
