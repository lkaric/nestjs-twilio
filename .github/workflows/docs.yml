# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Docs

# Deploy only. Pull requests are covered by the `Docs site` job in ci.yml,
# which gates the required CI check — so a broken site is caught at review
# time, not at deploy time.
on:
  push:
    branches: [master]
    # Only redeploy when something the site actually renders changed.
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  # Never cancel a deployment midway; a half-published site is worse than a
  # slightly stale one.
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Build documentation site
        run: pnpm docs:build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish to the Pages site
      id-token: write # the deploy action authenticates over OIDC
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
